<!DOCTYPE html>
<html>
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#stacking-content-alignment">
<link rel="author" title="John Jansen" href="mailto:john.jansen@microsoft.com">
<meta charset="utf-8">
<title>CSS Grid Test: column grid-lanes with align-content: center (reference)</title>
<style>
  html, body {
    color: black;
    background-color: white;
    font: 16px/1 monospace;
    padding: 0;
    margin: 0;
  }
  /*
   * Reference: use a regular grid with a centered row group.
   * 2 items per column, each 40px, with 10px gap = 90px stacking range.
   * Container height = 300px; free space = 300px - 10px(pad-top) - 10px(pad-bot) - 90px = 190px.
   * With center alignment, 95px offset from padding edge.
   */
  .outer {
    display: grid;
    grid-template-columns: 100px 100px;
    grid-template-rows: 40px 40px;
    gap: 10px;
    padding: 10px;
    height: 300px;
    width: 240px;
    box-sizing: border-box;
    border: 1px solid black;
    align-content: center;
    justify-items: stretch;
  }
  .item {
    background: lightgreen;
    padding: 4px;
    box-sizing: border-box;
  }
</style>
<body>
  <p>Test that <code>align-content: center</code> on a column grid-lanes container
  centers the stacking range (all items as a block) within the container.</p>
  <div class="outer">
    <div class="item">1</div>
    <div class="item">2</div>
    <div class="item">3</div>
    <div class="item">4</div>
  </div>
</body>
</html>
