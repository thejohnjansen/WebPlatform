<!DOCTYPE html>
<html>
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#placement-tolerance">
<link rel="match" href="column-flow-tolerance-percentage-001-ref.html">
<link rel="author" title="John Jansen" href="mailto:john.jansen@microsoft.com">
<meta charset="utf-8">
<title>CSS Grid Test: flow-tolerance as percentage of grid-axis content box</title>
<style>
  html, body {
    color: black;
    background-color: white;
    font: 16px/1 monospace;
    padding: 0;
    margin: 0;
  }
  /*
   * Container is 200px wide, 2 columns of 80px each (+ 20px gap = 180px padded).
   * flow-tolerance: 50% => 100px tie threshold.
   * Items: col1 height=20px, col2 height=100px.
   * Difference is 80px < 100px threshold, so item 3 goes to col1 (in source order).
   */
  .grid {
    display: grid-lanes;
    grid-template-columns: 80px 80px;
    gap: 20px;
    padding: 20px;
    width: 200px;
    box-sizing: border-box;
    flow-tolerance: 50%; /* 50% of 200px = 100px */
    border: 1px solid black;
  }
  .item {
    background: lightskyblue;
    padding: 4px;
    box-sizing: border-box;
  }
</style>
<body>
  <p>Test that <code>flow-tolerance</code> accepts percentage values relative to
  the grid-axis content box. With a 100px tolerance, items within 100px of the
  shortest column are placed in source order.</p>
  <div class="grid">
    <div class="item" style="height:20px">1</div>
    <div class="item" style="height:100px">2</div>
    <!-- col1 is 20px tall, col2 is 100px tall; diff=80px < 100px threshold:
         item 3 placed in col1 (next in source order after item 1) -->
    <div class="item" style="height:30px">3</div>
    <div class="item" style="height:30px">4</div>
  </div>
</body>
</html>
