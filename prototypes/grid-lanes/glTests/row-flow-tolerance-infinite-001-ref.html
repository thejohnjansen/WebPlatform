<!DOCTYPE html>
<html>
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#placement-tolerance">
<link rel="author" title="John Jansen" href="mailto:john.jansen@microsoft.com">
<meta charset="utf-8">
<title>CSS Grid Test: row grid-lanes with flow-tolerance: infinite (reference)</title>
<style>
  html, body {
    color: black;
    background-color: white;
    font: 16px/1 monospace;
    padding: 0;
    margin: 0;
  }
  /* Reference: explicit grid placement matching expected infinite-tolerance result.
     Items 1,3 go to row 1; items 2,4 go to row 2 (strict source order). */
  .outer {
    display: inline-grid;
    grid-template-rows: 60px 60px;
    grid-template-columns: max-content max-content;
    gap: 10px;
    height: 170px;
    border: 1px solid black;
    padding: 5px;
    width: 300px;
    box-sizing: border-box;
    align-items: start;
    justify-items: start;
  }
  .item {
    background: lightcoral;
    padding: 4px;
    box-sizing: border-box;
    height: 100%;
  }
</style>
<body>
  <p>Test that row grid-lanes with <code>flow-tolerance: infinite</code> distributes
  items strictly in row-source order, ignoring row lengths.</p>
  <div class="outer">
    <div class="item" style="width:10px; grid-row:1; grid-column:1">1</div>
    <div class="item" style="width:100px; grid-row:2; grid-column:1">2</div>
    <div class="item" style="width:20px; grid-row:1; grid-column:2">3</div>
    <div class="item" style="width:40px; grid-row:2; grid-column:2">4</div>
  </div>
</body>
</html>
