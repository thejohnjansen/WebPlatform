<!DOCTYPE html>
<html>
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#abspos">
<link rel="author" title="John Jansen" href="mailto:john.jansen@microsoft.com">
<meta charset="utf-8">
<title>CSS Grid Test: absolute positioning in grid-lanes stacking-axis lines (reference)</title>
<style>
  html, body {
    color: black;
    background-color: white;
    font: 16px/1 monospace;
    padding: 0;
    margin: 0;
  }
  /*
   * Reference: manually reproduce the expected layout.
   * 4 items, 2 cols, flow-tolerance:0, each 60px high.
   * col1: item1(60)+gap(10)+item3(60) = 130px stacking height
   * col2: item2(60)+gap(10)+item4(60) = 130px stacking height
   * stacking range = 130px
   * container height = 10(pad) + 130 + 10(pad) = 150px
   *
   * abs item: no grid-column, so spans full inline width = 100+10+100 = 210px.
   * grid-row: 1 / -1 spans full stacking range: top=10px, height=130px.
   */
  .outer {
    position: relative;
    width: 240px;
    height: 150px;
    box-sizing: border-box;
    border: 2px solid black;
  }
  .item1 { position: absolute; left: 10px;  top: 10px;  width: 100px; height: 60px; background: lightskyblue; padding: 4px; box-sizing: border-box; }
  .item2 { position: absolute; left: 120px; top: 10px;  width: 100px; height: 60px; background: lightskyblue; padding: 4px; box-sizing: border-box; }
  .item3 { position: absolute; left: 10px;  top: 80px;  width: 100px; height: 60px; background: lightskyblue; padding: 4px; box-sizing: border-box; }
  .item4 { position: absolute; left: 120px; top: 80px;  width: 100px; height: 60px; background: lightskyblue; padding: 4px; box-sizing: border-box; }
  .abs   { position: absolute; left: 10px;  top: 10px;  width: 210px; height: 130px; background: rgba(255,200,0,0.5); border: 2px dashed orange; box-sizing: border-box; }
</style>
<body>
  <p>Test that an absolutely positioned item with <code>grid-row: 1 / -1</code>
  spans the full stacking range (from stacking-axis line 1 to line -1).</p>
  <div class="outer">
    <div class="item1">1</div>
    <div class="item2">2</div>
    <div class="item3">3</div>
    <div class="item4">4</div>
    <div class="abs">abs</div>
  </div>
</body>
</html>
