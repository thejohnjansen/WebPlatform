<!DOCTYPE html>
<html>
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#rtl-example">
<link rel="author" title="John Jansen" href="mailto:john.jansen@microsoft.com">
<meta charset="utf-8">
<title>CSS Grid Test: column grid-lanes with direction: rtl (reference)</title>
<style>
  html, body {
    color: black;
    background-color: white;
    font: 16px/1 monospace;
    padding: 0;
    margin: 0;
  }
  /*
   * Reference: two independently-packed columns in RTL order.
   * With direction:rtl and flow-tolerance:0:
   *   item1(40px) -> col1 (inline-start = rightmost in RTL), col1=40px
   *   item2(70px) -> col2 (shorter at 0px),                  col2=70px
   *   item3(30px) -> col1 (shorter: 40px < 70px),            col1=40+10+30=80px
   *   item4(30px) -> col2 (shorter: 70px < 80px),            col2=70+10+30=110px
   * Each column packs independently; col1 right, col2 left.
   */
  .outer {
    display: inline-flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
    border: 1px solid black;
    box-sizing: border-box;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 80px;
  }
  .item {
    background: lightpink;
    padding: 4px;
    text-align: center;
    box-sizing: border-box;
  }
</style>
<body>
  <p>Test that <code>direction: rtl</code> on a column grid-lanes container
  places items from right to left.</p>
  <div class="outer">
    <!-- row-reverse: first child in DOM appears on the right (col1), second on the left (col2) -->
    <div class="col">
      <div class="item" style="height:40px">1</div>
      <div class="item" style="height:30px">3</div>
    </div>
    <div class="col">
      <div class="item" style="height:70px">2</div>
      <div class="item" style="height:30px">4</div>
    </div>
  </div>
</body>
</html>
