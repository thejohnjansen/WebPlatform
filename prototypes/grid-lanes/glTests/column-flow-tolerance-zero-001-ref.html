<!DOCTYPE html>
<html>
<link rel="help" href="https://drafts.csswg.org/css-grid-3/#placement-tolerance">
<link rel="author" title="John Jansen" href="mailto:john.jansen@microsoft.com">
<meta charset="utf-8">
<title>CSS Grid Test: flow-tolerance: 0 places items in strictly shortest column (reference)</title>
<style>
  html, body {
    color: black;
    background-color: white;
    font: 16px/1 monospace;
    padding: 0;
    margin: 0;
  }
  /*
   * Reference layout using explicit grid placement matching flow-tolerance:0 result.
   * 3 cols * 80px + 2*10 gap + 2*10 pad = 280px
   *
   * Placement order (shortest-first, no tie):
   *   item1(50px) -> col1 (all tied at 0 initially, col1 first) ; col1=50
   *   item2(40px) -> col2 ; col2=40
   *   item3(30px) -> col3 ; col3=30
   *   item4(40px) -> col3 shortest(30) ; col3=30+10+40=80
   *   item5(40px) -> col2 shortest(40) ; col2=40+10+40=90
   *   item6(30px) -> col1 shortest(50) ; col1=50+10+30=90
   */
  .outer {
    display: inline-grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: auto auto;
    gap: 10px;
    padding: 10px;
    border: 1px solid black;
    box-sizing: border-box;
    align-items: start;
  }
  .item {
    background: peachpuff;
    padding: 4px;
    box-sizing: border-box;
  }
</style>
<body>
  <p>Test that <code>flow-tolerance: 0</code> places each item into the strictly
  shortest column, ignoring source order when columns differ by any amount.</p>
  <div class="outer">
    <div class="item" style="height:50px; grid-column:1; grid-row:1">1</div>
    <div class="item" style="height:40px; grid-column:2; grid-row:1">2</div>
    <div class="item" style="height:30px; grid-column:3; grid-row:1">3</div>
    <div class="item" style="height:40px; grid-column:3; grid-row:2">4</div>
    <div class="item" style="height:40px; grid-column:2; grid-row:2">5</div>
    <div class="item" style="height:30px; grid-column:1; grid-row:2">6</div>
  </div>
</body>
</html>
